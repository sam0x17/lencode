[workspace]
members = ["macros", "."]
package.version = "1.2.1"
package.rust-version = "1.98.0"

[package]
name = "lencode"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "A crate for encoding and decoding variable-length data using the Lencode varint encoding scheme and deduplication"
keywords = ["encoding", "decoding", "bincode", "varint", "serde"]
authors = ["sam0x17"]
repository = "https://github.com/sam0x17/lencode"
documentation = "https://docs.rs/lencode/latest/lencode/"

[dependencies]
endian-cast = "2"
generic-array = "1"
agave-geyser-plugin-interface = { version = "4.3.0-beta.2", optional = true, features = ["agave-unstable-api"] }
solana-message = { version = "4.5.0", optional = true }
solana-transaction = { version = "4.3.0", optional = true }
solana-transaction-status = { version = "4.3.0-beta.2", optional = true, features = ["agave-unstable-api"] }
solana-transaction-context = { version = "4.3.0-beta.2", optional = true, features = ["agave-unstable-api"] }
solana-transaction-error = { version = "3.4.0", optional = true }
solana-instruction = { version = "3.5.0", optional = true }
solana-hash = { version = "4.6.0", optional = true }
solana-signature = { version = "3.5.2", optional = true }
solana-pubkey = { version = "4.3.0", optional = true, features = ["rand"] }
solana-sha256-hasher = { version = "3.1.0", optional = true, features = ["sha2"] }
solana-reward-info = { version = "6.3.0", optional = true }
solana-account-decoder-client-types = { version = "4.3.0-beta.2", optional = true, features = ["agave-unstable-api"] }
ruint = { version = "1", default-features = false}
newt-hype = { version = "0", default-features = false }
hashbrown = "0"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng"] }
smallbox = { version = "0.8", default-features = false }
zstd-safe = { version = "7", default-features = false }
bytes = { version = "1", optional = true }
lz4 = { version = "1.28", optional = true }
lz4-sys = { version = "1.11.1", optional = true }

lencode-macros = { path = "macros", version = "1.2.0" }

# Serialization helpers: keep bincode only for benches/examples
bincode = { version = "2", features = ["serde"], optional = true }

[dev-dependencies]
rayon = "1"
rand = "0.10"
criterion = { git = "https://github.com/sam0x17/criterion.rs", features = ["html_reports"] }
borsh = { version = ">= 1.5", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
wincode = { version = "0.6.1", features = ["derive"] }
solana-short-vec = { version = "3.3.0", features = ["wincode"] }
solana-hash = { version = "4.6.0", features = ["atomic"] }
solana-message = { version = "4.5.0", features = ["wincode"] }
solana-pubkey = { version = "4.3.0" }
solana-signature = { version = "3.5.2" }
solana-transaction = { version = "4.3.0", features = ["wincode"] }

[features]
default = []
std = ["ruint/std"]
comparison-bench = []
solana-types = [
    "std",
    "dep:bytes",
    "dep:lz4",
    "dep:lz4-sys",
    "dep:solana-message",
    "dep:solana-transaction",
    "dep:solana-hash",
    "dep:solana-signature",
    "dep:solana-pubkey",
    "dep:solana-sha256-hasher",
]
solana = [
    "solana-types",
    # Agave/geyser and supporting runtime/status types
    "dep:agave-geyser-plugin-interface",
    "dep:solana-transaction-status",
    "dep:solana-transaction-context",
    "dep:solana-transaction-error",
    "dep:solana-instruction",
    "dep:solana-reward-info",
    "dep:solana-account-decoder-client-types",
]

[profile.test]
opt-level = 3
lto = true

[profile.dev]
opt-level = 3
lto = true

[profile.release]
opt-level = 3
lto = true

[lints.clippy]
missing_const_for_fn = "warn"

[workspace.lints.clippy]
missing_const_for_fn = "warn"

[[bench]]
name = "varint_bench"
harness = false

[[bench]]
name = "roundup"
required-features = ["std"]
harness = false

[[bench]]
name = "solana_bench"
required-features = ["solana-types", "comparison-bench"]
harness = false

[[bench]]
name = "bytes_bench"
harness = false
required-features = ["std"]

[[bench]]
name = "diff_bench"
harness = false
required-features = ["std"]

[[bench]]
name = "codec_bench"
harness = false
required-features = ["std", "comparison-bench"]

[[bench]]
name = "io_bench"
harness = false

[[bench]]
name = "dedupe_bench"
harness = false

[[bench]]
name = "pack_bench"
harness = false

[[bench]]
name = "heuristic_bench"
harness = false
